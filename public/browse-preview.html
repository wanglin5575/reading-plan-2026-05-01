<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>随览页 · 静态预览</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #fff;
      --ink: #14202b;
      --muted: #5f6c7b;
      --border: #e3e8ef;
      --brand: #2e6cdf;
      --brand-soft: #e8efff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
      background: #d8dde8;
      padding: 24px 12px 32px;
      color: var(--ink);
    }
    .note {
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 420px;
      margin: 0 auto 16px;
      line-height: 1.5;
    }
    .phone {
      max-width: 414px;
      margin: 0 auto;
      background: var(--bg);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 12px 48px rgba(15, 23, 42, 0.12);
    }
    .app {
      padding: 16px 14px 120px;
    }
    .app-header {
      margin-bottom: 12px;
    }
    .app-header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .app-header .sub {
      color: var(--muted);
      font-size: 0.8125rem;
      margin-top: 4px;
      display: block;
    }
    .browse-pull-rail {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .browse-topic-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .browse-topic-tab {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font: inherit;
      font-size: 0.75rem;
      cursor: default;
    }
    .browse-topic-tab.active {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-soft);
      font-weight: 600;
    }
    .browse-topic-tab-add {
      border-style: dashed;
    }
    .browse-kw-line {
      margin: 0 0 12px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .browse-kw-chips {
      color: var(--ink);
    }
    .browse-hits .muted {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <p class="note">
    <strong>推荐</strong>：在项目目录执行 <code>npm run dev</code>，浏览器打开
    <strong>http://localhost:3000/browse-preview</strong>（不依赖本文件）。
    <br /><br />
    若用本地文件预览，路径中有空格时请使用编码后的地址，例如：
    <code>file:///Users/用户名/Cursor%20Projects/…/public/browse-preview.html</code>
  </p>
  <div class="phone">
    <div class="app">
      <header class="app-header">
        <h1>随览</h1>
        <span class="sub">主题与关键词 · 每日联网浏览相关更新</span>
      </header>
      <div class="browse-pull-rail" aria-hidden="true"></div>
      <div class="browse-topic-tabs">
        <span class="browse-topic-tab active">AI Evals</span>
        <span class="browse-topic-tab browse-topic-tab-add">＋主题</span>
      </div>
      <p class="browse-kw-line muted-link">
        关键词：<span class="browse-kw-chips">Hamel · Shreya · Stella&amp;Amy · Anthropic</span>
      </p>
      <div class="browse-hits">
        <p class="muted">暂无内容。请先滚回页面顶部，再下拉（触屏）或按住拖拽（鼠标）获取更新。</p>
      </div>
    </div>
  </div>
</body>
</html>
