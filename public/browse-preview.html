<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>随览页 · 静态预览</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #fff;
      --ink: #14202b;
      --muted: #5f6c7b;
      --border: #e3e8ef;
      --brand: #2e6cdf;
      --brand-soft: #e8efff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
      background: #d8dde8;
      padding: 24px 12px 32px;
      color: var(--ink);
    }
    .note {
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 420px;
      margin: 0 auto 16px;
      line-height: 1.5;
    }
    .phone {
      max-width: 414px;
      margin: 0 auto;
      background: var(--bg);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 12px 48px rgba(15, 23, 42, 0.12);
    }
    .app { padding: 16px 14px 120px; }
    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .head h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .head .sub { color: var(--muted); font-size: 0.8125rem; margin-top: 4px; display: block; line-height: 1.35; }
    .plus {
      width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--brand); color: #fff;
      font-size: 1.35rem; line-height: 1; flex-shrink: 0; cursor: default;
      box-shadow: 0 1px 2px rgba(15,23,42,0.06), 0 4px 14px rgba(15,23,42,0.06);
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
    .tab {
      padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card);
      color: var(--muted); font-size: 0.75rem;
    }
    .tab.active { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); font-weight: 600; }
    .kw { margin: 0 0 12px; font-size: 0.75rem; color: var(--muted); }
    .kw span { color: var(--ink); }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 12px 14px; margin-bottom: 10px;
    }
    .card a.title {
      font-size: 1.0625rem; font-weight: 600; color: var(--brand); text-decoration: none;
      display: block; margin-bottom: 6px;
    }
    .card p.body { margin: 0; font-size: 0.8125rem; color: var(--muted); line-height: 1.45; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .actions button {
      font-size: 0.8125rem; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); cursor: default;
    }
    .actions button.primary { background: var(--brand); color: #fff; border-color: transparent; }
  </style>
</head>
<body>
  <p class="note">
    <strong>推荐</strong>：<code>npm run dev</code> 后打开 <strong>http://localhost:3000/browse-preview</strong>。
    本文件为离线示意：右上角加号、双主题 pill、示例文章与「加入待读 / 加入已读」。
  </p>
  <div class="phone">
    <div class="app">
      <header class="head">
        <div>
          <h1>随览</h1>
          <span class="sub">主题与关键词 · 轻点主题切换列表 · 每日联网更新</span>
        </div>
        <button type="button" class="plus" aria-label="添加主题">+</button>
      </header>
      <div class="tabs">
        <span class="tab active">AI Evals</span>
        <span class="tab">工具链</span>
      </div>
      <p class="kw">关键词：<span>Hamel · Shreya · Stella&amp;Amy · Anthropic</span></p>
      <div class="card">
        <a class="title" href="https://example.com/evals">示例：LLM Evals 最佳实践（示意）</a>
        <p class="body">摘要节选示意。线上由 Firecrawl 抓取；按钮会请求 /api/articles 写入待读或一键已读。</p>
        <div class="actions">
          <button type="button">加入待读</button>
          <button type="button" class="primary">加入已读</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
